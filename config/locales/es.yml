      forms: "Formularios"
      tips: "Tips"
    whats_new:
      title: "Flujo actualizado"
      whiteboard: "Pizarras colaborativas con lienzo infinito: dibuja en tiempo real y comparte el link con cualquiera, incluso sin cuenta."
      forms: "Formularios anonimos para recolectar respuestas sin que el remitente necesite registrarse."
      search: "Busqueda global con Cmd+K para encontrar reportes, transacciones, proyectos y mas."
    reports:
      title: "Como usar reportes diarios"
      step_1: "Desde Reportes, usa 'Nuevo reporte +' para abrir el panel lateral."
      step_2: "Completa responsable, trabajo en curso, tareas y bloqueos."
      step_3: "Guarda y veras la lista actualizada sin salir de la vista."
    finance:
      title: "Como usar finanzas"
      step_1: "En Finanzas, registra ingresos o egresos desde 'Registrar +'."
      step_2: "Asigna categoria para que el dashboard agrupe tus gastos."
      step_3: "Configura presupuestos por categoria y monitorea alertas de uso."
    productivity:
      title: "Como usar productividad"
      step_1: "Crea proyectos con meta y descripcion para mantener claridad."
      step_2: "Agrega tareas por proyecto y marcalas como completadas."
      step_3: "Complementa con habitos y lista de compras para rutina diaria."
    whiteboards:
      title: "Como usar pizarras"
      step_1: "Crea una pizarra y comparte el link publico. Cualquiera puede dibujar, incluso sin cuenta."
      step_2: "Usa lapiz, formas, flechas y goma. Haz zoom con la rueda del raton y panea con espacio + arrastre."
      step_3: "Exporta como PNG cuando termines. Las pizarras se sincronizan en tiempo real."
    forms:
      title: "Como usar formularios"
      step_1: "Crea un formulario anonimo con las preguntas que necesites."
      step_2: "Comparte el link publico para recolectar respuestas sin registro."
      step_3: "Revisa las respuestas y estadisticas desde el detalle del formulario."
    tips:
      title: "Recomendaciones"
      item_1: "Usa el dashboard para revisar bloqueos e indicadores del mes."
      item_2: "Mantener categorias consistentes mejora tus reportes financieros."
      item_3: "Si pruebas un cambio nuevo, puedes comparar rapido desde esta guia."
    quick_actions:
      go_dashboard: "Ir al dashboard"
      open_reports: "Abrir reportes"
      open_finance: "Abrir finanzas"
      open_projects: "Abrir proyectos"
